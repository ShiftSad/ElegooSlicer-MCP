openapi: 3.0.3
info:
  title: ElegooSlicer MCP Remote API
  version: "1.0"
  description: |
    Token-authenticated HTTP + WebSocket API embedded in ElegooSlicer MCP, exposing the
    running application for automation (status, live config read/write, slicing,
    and an event stream).

    **Enabling:** Preferences → *Remote API*: enable, choose LAN vs localhost,
    port (default 13130), and copy/regenerate the token. Off by default.

    **Auth:** every HTTP request must send `X-Api-Token: <token>`. The WebSocket
    endpoint authenticates via a `?token=<token>` query parameter (browser WS
    clients cannot set request headers).

    **Threading note:** the server runs a single I/O thread and dispatches most
    endpoints onto the GUI thread with a 10s timeout (`504 ui_timeout`). Treat the
    API as single-client; concurrent heavy calls serialize.
servers:
  - url: http://{host}:{port}/api/v1
    variables:
      host: { default: "127.0.0.1", description: "localhost, or the machine's LAN IP when 'Bind LAN' is on" }
      port: { default: "13130" }
security:
  - ApiToken: []
paths:
  /status:
    get:
      summary: Application + project status
      operationId: getStatus
      responses:
        "200":
          description: Current app, project, loaded objects, selected/modified presets, and slice validity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /config:
    get:
      summary: Read the merged (full) config
      operationId: getConfig
      description: |
        Returns the secure merged config (secrets redacted) as canonical string
        values (same form as `.ini`/`.3mf`). Optionally filter with `?keys=`.
      parameters:
        - name: keys
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated key list, e.g. `layer_height,wall_loops`.
          example: layer_height,wall_loops
      responses:
        "200":
          description: Config map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    type: object
                    additionalProperties: { type: string }
                    example: { layer_height: "0.2", wall_loops: "2" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Apply config changes (live)
      operationId: putConfig
      description: |
        Applies key/value edits through the GUI's own edit path (dirty markers +
        live panel refresh + slice invalidation), exactly as if typed in the UI.

        **Atomic:** if ANY key is unknown or fails validation, NOTHING is applied
        and the response is `422` with `error: config_rejected` and per-key
        reasons (PUT /objects/{id}/config and PUT /objects/{id}/volumes/{vid}/config
        answer a refused key the same way). Print or printer settings the window
        would question (spiral vase with several walls, firmware retraction with
        wipe...) are refused the same way, with the window's question under
        `errors._question`. On full success the
        response is `200` with every applied key.

        Values may be JSON strings, numbers, or booleans; they are coerced to the
        canonical config string form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: { layer_height: 0.28, wall_loops: 3 }
      responses:
        "200":
          description: All keys applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigApplyResult" }
              example: { applied: ["layer_height", "wall_loops"], errors: {} }
        "422":
          description: At least one key invalid — nothing applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigApplyResult" }
              example: { error: "config_rejected", applied: [], errors: { layer_height: "value out of range", bogus_key: "unknown_key" } }
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_object: { value: { error: "body_must_be_object" } }
                bad_json:   { value: { error: "invalid_json" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /slice:
    post:
      summary: Start slicing the current plate
      operationId: startSlice
      description: |
        Triggers a reslice of the current plate. Progress and completion are
        delivered as `slice.*` WebSocket events and via `GET /slice/status`.
      responses:
        "202":
          description: Slicing started.
          content:
            application/json:
              schema: { type: object, properties: { started: { type: boolean, enum: [true] } } }
              example: { started: true }
        "200":
          description: Plate already sliced (valid result) — nothing to do.
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean, enum: [false] }
                  already_valid: { type: boolean, enum: [true] }
              example: { started: false, already_valid: true }
        "409":
          description: A slice is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "already_slicing" }
        "422":
          description: Nothing to slice (no objects on the plate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "nothing_to_slice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /slice/status:
    get:
      summary: Current/last slice state
      operationId: getSliceStatus
      responses:
        "200":
          description: Slice state snapshot. `stats` present once done; `warnings` always present (may be empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SliceStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /events:
    get:
      summary: WebSocket event stream (upgrade)
      operationId: events
      description: |
        **This is a WebSocket endpoint, not a normal GET.** Open a WebSocket to
        `ws://{host}:{port}/api/v1/events?token=<token>`. A bad/missing token
        closes the connection immediately. Inbound messages are ignored.

        Each message is a JSON object with an `event` field. See the
        `Event` schema for the payload shapes:
        `slice.started`, `slice.progress`, `slice.done`, `slice.error`,
        `slice.cancelled`, `slice.plate_changed`, `config.changed`, `project.opened`.

        Note: `slice.*` event payloads carry `stats` (on done) but NOT the slice
        `warnings` array — fetch `GET /slice/status` for warnings.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "101": { description: Switching Protocols (WebSocket handshake accepted). }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /model:
    post:
      summary: Load a model file onto the plate
      operationId: loadModel
      description: |
        Loads a `.stl`, `.obj`, `.3mf`, `.step` or `.stp` file from a path on the
        machine running the slicer, as an import in the window does. A missing file
        answers `404 file_not_found` with the path; a bare `404 not_found` only ever
        means an unknown route. The GUI-thread timeout is 120s here (not 10s), so
        a large STEP can finish tessellating.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: "Absolute path of the model file." }
            example: { path: "C:/models/part.stl" }
      responses:
        "200":
          description: Model loaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  loaded: { type: boolean, enum: [true] }
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        name: { type: string }
                        size_mm: { $ref: "#/components/schemas/Vec3" }
              example: { loaded: true, objects: [ { index: 0, name: "part.stl", size_mm: [20, 20, 10] } ] }
        "400":
          description: Missing `path`, or malformed JSON.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                missing_path: { value: { error: "missing_path" } }
                bad_json:     { value: { error: "invalid_json" } }
        "404":
          description: The file does not exist. The body echoes the path that was asked for.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "file_not_found", path: "C:/models/part.stl" }
        "422":
          description: Unsupported file type, or the slicer could not load the file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                format: { value: { error: "unsupported_format", detail: "remote load supports .stl, .obj, .3mf, .step, .stp" } }
                failed: { value: { error: "load_failed" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /plates:
    get:
      summary: List the plates
      operationId: getPlates
      description: |
        Every plate in the project with its index (0-based), name, whether it is the
        current one (the plate `slice`, `gcode`, `plate/render` and `jobs/status`
        act on), lock state, build volume and the objects it holds. Also reports
        `max` (the plate limit) and whether a plate can be added or deleted now.
      responses:
        "200":
          description: Plate list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
    post:
      summary: Add a plate
      operationId: createPlate
      description: |
        Same steps as the toolbar's "Add plate": a new empty plate is appended and,
        unless `select` is false, becomes the current plate.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                select: { type: boolean, default: true, description: "Make the new plate current." }
      responses:
        "200":
          description: Plate created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: boolean, enum: [true] }
                  index: { type: integer, description: "0-based index of the new plate." }
                  count: { type: integer }
                  current: { type: integer }
                  plate: { $ref: "#/components/schemas/Plate" }
        "409":
          description: A slice is running; plates cannot be added until it ends.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "slicing" }
        "422":
          description: The plate limit is reached (`max` says what it is).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "max_plates", max: 36 }
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /plates/{index}:
    delete:
      summary: Delete a plate
      operationId: deletePlate
      description: |
        Removes plate `index`. The objects it held are not deleted: they are parked
        beside the bed, as the toolbar's delete does, and `objects_moved_off_plate`
        reports how many. Later plates shift down one index.
      parameters:
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Plate deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, enum: [true] }
                  index: { type: integer }
                  count: { type: integer }
                  current: { type: integer }
                  objects_moved_off_plate: { type: integer }
        "404":
          description: No plate with that index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unknown_plate", count: 2 }
        "409":
          description: A slice is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "slicing" }
        "422":
          description: The only plate cannot be deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "last_plate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /plates/{index}/select:
    post:
      summary: Make a plate the current one
      operationId: selectPlate
      description: |
        Equivalent to clicking the plate: `slice`, `gcode`, `plate/render` and
        `jobs/status` then act on it. Selecting the current plate again is a no-op.
      parameters:
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Plate selected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  selected: { type: boolean, enum: [true] }
                  current: { type: integer }
                  plate: { $ref: "#/components/schemas/Plate" }
        "404":
          description: No plate with that index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unknown_plate", count: 2 }
        "409":
          description: A slice is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "slicing" }
        "422":
          description: The slicer refused the switch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "select_failed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /objects/{id}/plate:
    post:
      summary: Move an object onto a plate
      operationId: setObjectPlate
      description: |
        Moves one instance of the object (default instance 0) onto plate `plate`.
        From another plate it keeps its position relative to that plate; from
        off-plate it lands at the target plate's centre. The move takes an undo
        snapshot and refreshes the object list and background process like a drag.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Object id as reported by GET /objects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plate]
              properties:
                plate: { type: integer, minimum: 0, description: "0-based plate index from GET /plates." }
                instance: { type: integer, minimum: 0, default: 0 }
            example: { plate: 1 }
      responses:
        "200":
          description: Moved (or already there, with `moved` false and `already_on_plate` true).
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved: { type: boolean }
                  already_on_plate: { type: boolean }
                  id: { type: integer }
                  instance: { type: integer }
                  plate: { type: integer }
                  from_plate: { type: integer, description: "-1 when it was off every plate." }
                  offset: { $ref: "#/components/schemas/Vec3" }
              example: { moved: true, id: 832, instance: 0, plate: 1, from_plate: 0, offset: [409, 128, 6] }
        "400":
          description: Missing or malformed `plate` / `instance`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "missing_plate" }
        "404":
          description: Unknown object, instance or plate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                object:   { value: { error: "unknown_object" } }
                plate:    { value: { error: "unknown_plate", count: 2 } }
                instance: { value: { error: "unknown_instance", instances: 1 } }
        "409":
          description: A slice is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "slicing" }
        "422":
          description: The plate is locked, or the slicer refused the move.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                locked: { value: { error: "plate_locked" } }
                failed: { value: { error: "move_failed" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /objects/{id}/transform:
    post:
      summary: Move, rotate and/or scale an object
      operationId: transformObject
      description: |
        Applies to the object's first copy, in this order: `translate` (mm, added to
        the current position), then `rotate` (degrees, about the **world** axes from
        the current orientation, as the rotate gizmo does: X first, then Y, then Z,
        around the object's origin, so the rotation itself does not move `offset`,
        though the drop onto the bed below may then change its Z; successive calls add
        up like gizmo drags), then `scale` (absolute factor along the object's own
        axes). Afterwards the object is put back on the bed as a drag in the window
        does: a floating object drops onto the bed (a pure upward `translate` does not
        lift it); one below the bed is lifted back up unless the request was a pure
        `translate` or it was already below the bed before the `rotate`/`scale`. Then
        the plate it sits on is re-checked.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Object id as reported by GET /objects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of the three keys.
              properties:
                translate: { $ref: "#/components/schemas/Vec3" }
                rotate: { $ref: "#/components/schemas/Vec3" }
                scale: { $ref: "#/components/schemas/Vec3" }
            example: { rotate: [0, -90, 0] }
      responses:
        "200":
          description: Transformed. `rotation` is in radians (X, Y, Z angles of the new orientation).
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  transform:
                    type: object
                    properties:
                      offset: { $ref: "#/components/schemas/Vec3" }
                      rotation: { $ref: "#/components/schemas/Vec3" }
                      scale: { $ref: "#/components/schemas/Vec3" }
              example: { id: 832, transform: { offset: [128, 128, 10], rotation: [0, -1.5708, 0], scale: [1, 1, 1] } }
        "400":
          description: No transform given, body not an object, malformed JSON or bad id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                none:       { value: { error: "no_transform" } }
                not_object: { value: { error: "body_must_be_object" } }
                bad_json:   { value: { error: "invalid_json" } }
                bad_id:     { value: { error: "bad_object_id" } }
        "404":
          description: Unknown object, or an object without a copy on the bed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                object:   { value: { error: "unknown_object" } }
                instance: { value: { error: "no_instance" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /orient:
    post:
      summary: Auto-orient every object, or one object
      operationId: orient
      description: |
        Starts the window's auto-orient job (asynchronous; poll GET /jobs/status until
        `idle`). With `object_id` only that object is oriented: it is selected in the 3D
        view and the job orients the selection (it stays selected). Without a body, or
        with `{}`, every object is oriented and the window's selection is cleared first.
        When the job starts, the object's plates (every plate without `object_id`) are
        marked unsliced. Objects on a locked plate and unprintable objects are left
        alone; an unprintable `object_id` is refused (the job would orient every other
        object).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                object_id: { type: integer, description: "Object id as reported by GET /objects." }
            example: { object_id: 832 }
      responses:
        "202":
          description: Orient job started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean }
                  object_id: { type: integer, description: "Present when one object was asked for." }
              example: { started: true, object_id: 832 }
        "400":
          description: Malformed body or object id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                bad_id:     { value: { error: "bad_object_id" } }
                not_object: { value: { error: "body_must_be_object" } }
                bad_json:   { value: { error: "invalid_json" } }
        "404":
          description: Unknown object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unknown_object" }
        "409":
          description: |
            Another arrange/orient job is running, the object is unprintable, or the
            3D view could not select it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                busy:         { value: { error: "job_running" } }
                unprintable:  { value: { error: "object_not_printable" } }
                not_selected: { value: { error: "select_failed" } }
        "422":
          description: No objects to orient.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "empty" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /view:
    post:
      summary: Show the Prepare or Preview tab
      operationId: setView
      description: |
        Switches the main window to the Prepare (3D editor) or Preview tab, as the tab
        buttons do. With a G-code file open the window is preview-only and `prepare` is
        refused (the Prepare button would ask whether to close that file).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view]
              properties:
                view: { type: string, enum: [prepare, preview] }
            example: { view: preview }
      responses:
        "200":
          description: The tab now showing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  view: { type: string, enum: [prepare, preview, other] }
              example: { view: preview }
        "400":
          description: Missing view or malformed JSON.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                missing:  { value: { error: "missing_view" } }
                bad_json: { value: { error: "invalid_json" } }
        "409":
          description: A G-code file is open (preview-only window).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "preview_only" }
        "422":
          description: Unknown view name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "bad_view" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /objects/{id}/volumes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer }, description: "Object id as reported by GET /objects." }
    get:
      summary: List an object's volumes
      operationId: getVolumes
      responses:
        "200":
          description: Parts, modifiers, negative volumes and support enforcers/blockers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: integer }
                  volumes: { type: array, items: { $ref: "#/components/schemas/Volume" } }
        "404":
          description: Unknown object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unknown_object" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
    post:
      summary: Add a modifier, negative volume or support enforcer/blocker
      operationId: addVolume
      description: |
        Same as right-click > Add modifier / negative volume / support enforcer /
        support blocker > Cube, Cylinder or Sphere, without its tips dialog. The shape
        stays aligned with the bed, its centre goes to `position_mm` (world mm, first
        copy) and its size is `size_mm`. `config` is checked like PUT
        /objects/{id}/config before anything is added.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, shape, size_mm, position_mm]
              properties:
                type: { type: string, enum: [modifier, negative, support_enforcer, support_blocker] }
                shape: { type: string, enum: [box, cylinder, sphere] }
                size_mm: { $ref: "#/components/schemas/Vec3" }
                position_mm: { $ref: "#/components/schemas/Vec3" }
                name: { type: string }
                config: { type: object, additionalProperties: true }
            example: { type: modifier, shape: box, size_mm: [30, 30, 5], position_mm: [128, 128, 12.5], config: { sparse_infill_density: "40%" } }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  volume: { $ref: "#/components/schemas/Volume" }
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_object: { value: { error: "body_must_be_object" } }
                name:       { value: { error: "name_must_be_string" } }
                config:     { value: { error: "config_must_be_object" } }
                bad_json:   { value: { error: "invalid_json" } }
        "404":
          description: Unknown object, or one without a copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                object:   { value: { error: "unknown_object" } }
                instance: { value: { error: "no_instance" } }
        "422":
          description: Bad type, shape, size or position, or a refused config key (nothing added).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                type:     { value: { error: "bad_type" } }
                shape:    { value: { error: "bad_shape" } }
                size:     { value: { error: "bad_size" } }
                position: { value: { error: "bad_position" } }
                config:   { value: { error: "config_rejected", applied: [], errors: { post_process: "blocked_by_remote_api_policy" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /objects/{id}/volumes/{vid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: vid, in: path, required: true, schema: { type: integer }, description: "Volume id as reported by GET /objects/{id}/volumes." }
    delete:
      summary: Remove a volume
      operationId: deleteVolume
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
              example: { ok: true }
        "400":
          description: Malformed volume id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "bad_volume_id" }
        "404":
          description: Unknown object or volume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                object: { value: { error: "unknown_object" } }
                volume: { value: { error: "unknown_volume" } }
        "409":
          description: The window would ask first (last solid part, or a part of a cut object).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                last_part:  { value: { error: "last_part" } }
                cut_object: { value: { error: "cut_object" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /objects/{id}/volumes/{vid}/config:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: vid, in: path, required: true, schema: { type: integer } }
    put:
      summary: Set one volume's own settings (atomic)
      operationId: putVolumeConfig
      description: |
        Same semantics and key policy as PUT /objects/{id}/config: nothing is applied
        if any key is refused. `extruder` picks the volume's filament slot (0 = the
        object's).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example: { sparse_infill_density: "40%", extruder: 2 }
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: array, items: { type: string } }
                  errors: { type: object }
                  object: { type: string }
                  volume: { $ref: "#/components/schemas/Volume" }
        "400":
          description: Body is not an object, malformed JSON or bad id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown object or volume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: At least one key refused; nothing applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigApplyResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /project/save:
    post:
      summary: Save the project as a .3mf
      operationId: saveProject
      description: |
        Uses the window's Save code without its dialogs. Without `path` it saves over
        the current project file. With `path` (absolute, existing folder, `.3mf`) it
        saves there like Save As and the project takes that name; an existing file is
        replaced only with `overwrite: true`. Waits up to 120 s. Refused, as the
        window's Save is, while a G-code file or an exported .gcode.3mf is open
        (`preview_only`) or a tool in the 3D view is mid-edit (`gizmo_editing`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string }
                overwrite: { type: boolean, default: false }
            example: { path: "C:/Users/me/Documents/helmet.3mf", overwrite: false }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { type: object, properties: { path: { type: string } } }
              example: { path: "C:/Users/me/Documents/helmet.3mf" }
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_object: { value: { error: "body_must_be_object" } }
                path:       { value: { error: "path_must_be_string" } }
                overwrite:  { value: { error: "overwrite_must_be_boolean" } }
                bad_json:   { value: { error: "invalid_json" } }
        "409":
          description: |
            No current project file to save over, the target exists, a G-code file
            is open (preview only), or a 3D-view tool is mid-edit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unnamed: { value: { error: "project_unnamed" } }
                exists:  { value: { error: "file_exists" } }
                gcode:   { value: { error: "preview_only" } }
                editing: { value: { error: "gizmo_editing" } }
        "422":
          description: Not a .3mf path, or not an absolute path in an existing folder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                ext:  { value: { error: "not_3mf" } }
                path: { value: { error: "bad_path" } }
        "500":
          description: Writing the file failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "save_failed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /objects/{id}/paint:
    post:
      summary: Paint support, seam or color on an object's triangles
      operationId: paintObject
      description: |
        Writes into the data the paint gizmos edit (support enforcers/blockers, seam,
        color). A triangle of the object's solid parts is painted when its centroid,
        in world mm of the first copy, is inside `box_mm` (no box: every triangle) and,
        with `max_overhang_deg` = a, when its outward normal points down at least a
        degrees below horizontal (unit normal n: n.z < 0 and -n.z >= sin(a); 90 = only
        flat undersides, 45 = the usual overhangs, 0 = every downward face).
        `clear: true` first erases the layer on the whole object (it takes no
        `box_mm`; use state `none` to erase inside a box); with no state/slot it only
        erases. The object's plates are marked unsliced.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layer]
              properties:
                layer: { type: string, enum: [support, seam, color] }
                state: { type: string, enum: [enforce, block, none], description: "support and seam layers." }
                slot: { type: integer, minimum: 1, description: "color layer: 1-based filament slot." }
                box_mm:
                  type: array
                  items: { $ref: "#/components/schemas/Vec3" }
                  minItems: 2
                  maxItems: 2
                max_overhang_deg: { type: number, minimum: 0, maximum: 90, description: "Degrees below horizontal the outward normal must point, at least." }
                clear: { type: boolean, default: false }
            example: { layer: support, state: enforce, box_mm: [[0, 0, 0], [256, 256, 10]], max_overhang_deg: 45 }
      responses:
        "200":
          description: Painted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  painted_triangles: { type: integer }
                  layer: { type: string }
                  cleared: { type: boolean }
              example: { painted_triangles: 412, layer: support, cleared: false }
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown object, or one without a copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Bad layer, state, slot, box or overhang angle, or clear with a box.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                layer:     { value: { error: "bad_layer" } }
                state:     { value: { error: "bad_state" } }
                slot:      { value: { error: "bad_slot" } }
                box:       { value: { error: "bad_box" } }
                overhang:  { value: { error: "bad_overhang" } }
                clear_box: { value: { error: "clear_takes_no_box" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /printers:
    get:
      summary: List the Elegoo printers of the Device tab
      operationId: getPrinters
      description: |
        Capability `printers`. Every printer of ElegooSlicer's printer manager, from its
        cache (kept up to date by the printers' status messages), and the printer the
        Print dialog would preselect. Fields are a whitelist: no access code, PIN,
        password, token, user name, serial number, mainboard id or web URL.
      responses:
        "200":
          description: The printers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  printers:
                    type: array
                    items: { $ref: "#/components/schemas/Printer" }
                  selected_id:
                    type: string
                    nullable: true
                    description: |
                      The printer the Print dialog would preselect (last printer sent to,
                      if of the project's printer model; else the first of that model; else
                      the last sent to; else the first). Null when there are no printers.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/PrinterError" }
        "503": { $ref: "#/components/responses/PrintersUnavailable" }
        "504": { $ref: "#/components/responses/PrinterTimeout" }
  /printers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "Printer id as reported by GET /printers." }
    get:
      summary: One Elegoo printer
      operationId: getPrinter
      responses:
        "200":
          description: The printer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Printer" }
        "404": { $ref: "#/components/responses/PrinterNotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/PrintersUnavailable" }
        "504": { $ref: "#/components/responses/PrinterTimeout" }
  /printers/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: One printer with its exception codes and the age of the data
      operationId: getPrinterStatus
      description: |
        Also asks the printer to send its status again (at most once every 2 s per
        printer, without waiting for it); the answer updates the cache for the next call.
        `raw=1` adds the SDK's raw status JSON (keys named like a secret or holding one of the
        printer's secret values removed, strings holding one set to null), read at most
        once every 2 s per printer; the SDK has it for cloud printers only.
      parameters:
        - { name: raw, in: query, required: false, schema: { type: string, enum: ["1", "true"] } }
      responses:
        "200":
          description: The printer, its exceptions and age_s (plus raw and raw_age_s with raw=1).
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Printer" }
                  - type: object
                    properties:
                      exceptions:
                        type: array
                        description: Exception codes in the printer's current status (only the code is known).
                        items:
                          type: object
                          properties:
                            code: { type: string }
                            level: { type: integer, nullable: true }
                            time: { type: integer, nullable: true }
                      age_s: { type: integer, nullable: true, description: "Seconds since the cache last heard from or about the printer." }
                      raw: { type: object, description: "raw=1 only." }
                      raw_age_s: { type: integer, description: "raw=1 only." }
        "404": { $ref: "#/components/responses/PrinterNotFound" }
        "409": { $ref: "#/components/responses/PrinterOffline" }
        "501": { $ref: "#/components/responses/UnsupportedOnLan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/PrinterError" }
        "503": { $ref: "#/components/responses/PrintersUnavailable" }
        "504": { $ref: "#/components/responses/PrinterTimeout" }
  /printers/{id}/tasks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Print history of a cloud printer
      operationId: getPrinterTasks
      description: The SDK reads it from Elegoo's cloud only; a LAN printer answers 501 without asking.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        begin_ts: { type: integer }
                        end_ts: { type: integer }
                        status_code: { type: integer }
        "400":
          description: Bad page or size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                page: { value: { error: "bad_page" } }
                size: { value: { error: "bad_size" } }
        "404": { $ref: "#/components/responses/PrinterNotFound" }
        "409": { $ref: "#/components/responses/PrinterOffline" }
        "501": { $ref: "#/components/responses/UnsupportedOnLan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/PrinterError" }
        "503": { $ref: "#/components/responses/PrintersUnavailable" }
        "504": { $ref: "#/components/responses/PrinterTimeout" }
  /printers/{id}/files:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Files stored on a cloud printer
      operationId: getPrinterFiles
      description: The SDK reads it from Elegoo's cloud only; a LAN printer answers 501 without asking.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        size_bytes: { type: integer }
                        print_time_s: { type: integer }
                        layers: { type: integer }
                        layer_height_mm: { type: number }
                        created_ts: { type: integer }
                        filament_g: { type: number }
                        filament_mm: { type: number }
                        print_count: { type: integer }
                        last_print_ts: { type: integer }
        "400":
          description: Bad page or size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/PrinterNotFound" }
        "409": { $ref: "#/components/responses/PrinterOffline" }
        "501": { $ref: "#/components/responses/UnsupportedOnLan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/PrinterError" }
        "503": { $ref: "#/components/responses/PrintersUnavailable" }
        "504": { $ref: "#/components/responses/PrinterTimeout" }
  /printers/{id}/canvas:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: CANVAS units and trays of a printer
      operationId: getCanvas
      description: |
        Capability `canvas`. The read the GUI's CANVAS sync and Print dialogs make: a
        request to the printer, trays named A1..A4, B1.. by unit order, each loaded tray
        matched to a filament preset. A reply is reused for 5 s (`age_s`), and while one
        request is asking a printer the others wait for its answer (the CC2 ignores
        requests for a while when it gets 3 or more in a row).
      responses:
        "200":
          description: The CANVAS state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Canvas" }
        "404": { $ref: "#/components/responses/PrinterNotFound" }
        "409":
          description: The printer is offline or reports no multi-filament support.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                offline:     { value: { error: "printer_offline" } }
                unsupported: { value: { error: "canvas_unsupported" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/PrinterError" }
        "503": { $ref: "#/components/responses/PrintersUnavailable" }
        "504": { $ref: "#/components/responses/PrinterTimeout" }
  /printers/{id}/canvas/sync:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Make the CANVAS trays the project's filaments (the GUI's Sync button)
      operationId: syncCanvas
      description: |
        Capability `canvas`. The GUI's "Sync filaments with MMS" without its dialogs (same
        code). `filament_and_color` (default, as the GUI) replaces the project's filament
        slots with the synced trays in tray order; `color_only` copies the trays' colours to
        the first slots. Flush volumes are recalculated as in the GUI, every plate is marked
        unsliced, and the printer becomes the one the Print dialog preselects.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [filament_and_color, color_only], default: filament_and_color }
                discard_changes:
                  type: boolean
                  default: false
                  description: Drop unsaved edits of the Filament tab's preset instead of answering 409 unsaved_filament_changes.
      responses:
        "200":
          description: The project's filament slots after the sync.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanvasSyncResult" }
        "400":
          description: Bad body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalid_json:    { value: { error: "invalid_json" } }
                not_an_object:   { value: { error: "body_must_be_object" } }
                mode_type:       { value: { error: "bad_mode", detail: "mode: \"filament_and_color\" | \"color_only\"" } }
                discard_changes: { value: { error: "bad_discard_changes", detail: "discard_changes: true | false" } }
        "404": { $ref: "#/components/responses/PrinterNotFound" }
        "409":
          description: |
            Nothing was changed. `unsaved_filament_changes`: the Filament tab's preset has
            unsaved edits (save them or pass `discard_changes: true`). `no_compatible_filaments`:
            no tray can be synced (`unknown` says why). `canvas_disconnected`: no CANVAS unit is
            connected. Also `printer_offline`, `canvas_unsupported`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [unsaved_filament_changes, no_compatible_filaments, canvas_disconnected, printer_offline, canvas_unsupported] }
                  preset: { type: string, description: "unsaved_filament_changes: the modified preset." }
                  hint: { type: string }
                  unknown:
                    type: array
                    description: "no_compatible_filaments: the trays and why they were not synced."
                    items: { $ref: "#/components/schemas/CanvasSyncUnknownTray" }
              examples:
                unsaved:
                  value: { error: "unsaved_filament_changes", preset: "Elegoo PLA @ECC2",
                           hint: "save the filament preset (POST /preset/save), or sync with \"discard_changes\": true" }
                none:
                  value: { error: "no_compatible_filaments", unknown: [{ tray: "A1", type: null, reason: "empty" }] }
                disconnected: { value: { error: "canvas_disconnected" } }
        "422":
          description: Unknown mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "bad_mode", detail: "mode: \"filament_and_color\" | \"color_only\"" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/PrinterError" }
        "503": { $ref: "#/components/responses/PrintersUnavailable" }
        "504":
          description: The CANVAS read (`printer_timeout`) or the GUI thread (`ui_timeout`) did not answer in time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                printer: { value: { error: "printer_timeout" } }
                gui:     { value: { error: "ui_timeout" } }
  /printers/{id}/canvas/mapping:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: The CANVAS tray each filament of a plate would print from
      operationId: getCanvasMapping
      description: |
        Capability `canvas`. Decided as the Print dialog decides it (same code): the tray
        picked for that filament in an earlier print when it is still loaded, else a ready
        tray of the same colour whose filament matches the slot's preset. Read-only.
      parameters:
        - { name: plate, in: query, required: false, schema: { type: integer, minimum: 0 }, description: "0-based; default: the current plate." }
      responses:
        "200":
          description: The mapping and its problems.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanvasMapping" }
        "400":
          description: Bad plate index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "bad_plate_index" }
        "404":
          description: Unknown printer or plate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                printer: { value: { error: "printer_not_found" } }
                plate:   { value: { error: "unknown_plate" } }
        "409":
          description: The printer is offline, reports no multi-filament support, or no CANVAS unit is connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                offline:      { value: { error: "printer_offline" } }
                unsupported:  { value: { error: "canvas_unsupported" } }
                disconnected: { value: { error: "canvas_disconnected" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/PrinterError" }
        "503": { $ref: "#/components/responses/PrintersUnavailable" }
        "504": { $ref: "#/components/responses/PrinterTimeout" }
  /printers/{id}/print/prepare:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Check a print of the current plate on a printer (nothing is sent)
      operationId: preparePrint
      description: |
        Capability `print_control`, preference `remote_api_allow_print_control` (see
        GET /status `print_control_enabled`). Makes the checks of the window's Print button
        and Print dialog (and a few more) and answers a summary and a plan id for
        POST /printers/{id}/print. The plan is used once, expires after 300 s, and is bound to
        the plate's slice result: slicing again, changing a setting or selecting another plate
        expires it. Options default to the Print dialog's last choices; an option the printer
        does not have is off. `mapping` picks trays for some slots; the others get the Print
        dialog's own choice (GET /printers/{id}/canvas/mapping). Nothing is saved. LAN
        printers only (501 unsupported_on_wan for a cloud printer).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                plate: { type: integer, minimum: 0, description: "0-based; default and only allowed value: the current plate." }
                bed_side: { type: string, enum: [A, B], description: "A: the textured PEI side; B: the other one (as the Print dialog). Needs bed switching." }
                leveling: { type: boolean, description: "Auto bed leveling before the print." }
                timelapse: { type: boolean, description: "LAN printers only." }
                auto_refill: { type: boolean, description: "CANVAS auto refill; needs a connected CANVAS." }
                mapping:
                  type: array
                  items:
                    type: object
                    required: [slot, tray]
                    properties:
                      slot: { type: integer, minimum: 1, description: "1-based filament slot the plate prints with." }
                      unit: { type: string, description: "Optional: the tray's unit id, as in GET /printers/{id}/canvas." }
                      tray: { type: string, example: A3, description: "A loaded or preloaded tray, as in GET /printers/{id}/canvas." }
      responses:
        "200":
          description: The plan and what it would do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrintPlan" }
        "400":
          description: Bad body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalid_json:  { value: { error: "invalid_json" } }
                not_an_object: { value: { error: "body_must_be_object" } }
                unknown_field: { value: { error: "unknown_field", field: "timelaps" } }
                plate:         { value: { error: "bad_plate_index" } }
                bed_side:      { value: { error: "bad_bed_side", detail: "bed_side: \"A\" | \"B\"" } }
                option:        { value: { error: "bad_timelapse", detail: "timelapse: true | false" } }
                mapping:       { value: { error: "bad_mapping", detail: "mapping: [{\"slot\": 1, \"unit\"?: \"0\", \"tray\": \"A1\"}], ..." } }
        "403": { $ref: "#/components/responses/PrintControlDisabled" }
        "404":
          description: Unknown printer or plate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                printer: { value: { error: "printer_not_found" } }
                plate:   { value: { error: "unknown_plate" } }
        "409":
          description: |
            Nothing was sent. The plate: `plate_not_current`, `not_sliced`, `not_printable`
            (+ `reason`: toolpath_outside | gcode_check_failed | filament_not_printable; stricter
            than the window on purpose, whose Print button sends such a plate),
            `preview_only` (a G-code file is open). The printer: `printer_offline`,
            `printer_busy` (+ `status`; only idle or print_completed take a print),
            `upload_in_progress` (+ `upload_id`), `printer_model_mismatch` (+ `printer_model`,
            `project_model`), `not_elegoolink_profile`, `upload_format_unsupported`. The
            filaments: `canvas_disconnected` / `canvas_unsupported` (+ `filaments`: several
            filaments without a connected CANVAS). Also `secondary_instance`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                busy:      { value: { error: "printer_busy", status: "printing" } }
                sliced:    { value: { error: "not_sliced", plate: 0 } }
                model:     { value: { error: "printer_model_mismatch", printer_model: "Elegoo Centauri Carbon", project_model: "Elegoo Centauri Carbon 2" } }
                canvas:    { value: { error: "canvas_disconnected", filaments: 2, hint: "the plate prints with several filaments; they need a connected CANVAS" } }
                secondary: { value: { error: "secondary_instance", hint: "close the other ElegooSlicer windows" } }
        "422":
          description: |
            `mapping_incomplete`: a slot has no tray (`no_tray`), a tray that is not ready
            (`tray_not_ready`) or a tray holding another filament, type and name both
            different as the Print dialog tests it (`type_mismatch`); `issues`
            lists them, `filaments` the whole mapping. `bad_mapping`: unknown slot or tray, a
            tray that is not loaded, or no CANVAS to map to. `unsupported_option` (+ `option`):
            the printer does not have it. `filename_format_error`: the print profile's
            filename_format does not process.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                mapping:
                  value: { error: "mapping_incomplete", issues: [{ slot: 2, issues: ["no_tray"] }], filaments: [],
                           hint: "load the filaments, sync the CANVAS (POST /printers/{id}/canvas/sync) or pick trays with \"mapping\"" }
                option: { value: { error: "unsupported_option", option: "timelapse" } }
        "501":
          description: A cloud (WAN) printer. The SDK cannot pause or stop one, so the API does not start prints on it. Nothing was sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unsupported_on_wan", hint: "the API cannot pause or stop a cloud printer, so it does not start prints on one: add the printer on the LAN, or print from ElegooSlicer's Print dialog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/PrinterError" }
        "503": { $ref: "#/components/responses/PrintersUnavailable" }
        "504":
          description: The printer list or the CANVAS read (`printer_timeout`) or the GUI thread (`ui_timeout`) did not answer in time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                printer: { value: { error: "printer_timeout" } }
                gui:     { value: { error: "ui_timeout" } }
  /printers/{id}/print:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Send a prepared print and start it
      operationId: startPrint
      description: |
        Capability `print_control`. Sends the plan POST /printers/{id}/print/prepare made and
        starts the print; answers at once. The printer's state and the plan's slice result are
        checked again, then the plate's sliced G-code (the same bytes and name the window's
        Print button sends) is copied, the print profile's post-processing scripts run on the
        copy, and ElegooSlicer's upload manager sends it with "upload and print". Follow it
        with GET /uploads/{id}. Never takes a file or a path from the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              additionalProperties: false
              properties:
                plan_id: { type: string }
      responses:
        "202":
          description: Sending started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_id: { type: string }
        "400":
          description: Bad body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                plan_id:       { value: { error: "bad_plan_id", detail: "plan_id: the id POST /printers/{id}/print/prepare answered" } }
                invalid_json:  { value: { error: "invalid_json" } }
                unknown_field: { value: { error: "unknown_field", field: "plan" } }
        "403": { $ref: "#/components/responses/PrintControlDisabled" }
        "404":
          description: Unknown printer, or no such plan for this printer (a plan is used once).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                plan:    { value: { error: "unknown_plan" } }
                printer: { value: { error: "printer_not_found" } }
        "409":
          description: "`printer_offline`, `printer_busy` (+ `status`), `upload_in_progress` (+ `upload_id`), `secondary_instance`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "printer_busy", status: "printing" }
        "410":
          description: The plan is older than 300 s, or the plate was sliced again or changed, another plate was selected, or a setting changed. Prepare again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "plan_expired", detail: "the plan is older than 5 minutes; prepare again" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/PrintersUnavailable" }
        "504":
          description: The printer list (`printer_timeout`) or the GUI thread (`ui_timeout`) did not answer in time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                printer: { value: { error: "printer_timeout" } }
                gui:     { value: { error: "ui_timeout" } }
  /uploads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "The upload_id POST /printers/{id}/print answered." }
    get:
      summary: How a print sent by POST /printers/{id}/print is going
      operationId: getUpload
      description: Capability `print_control`. An upload stays readable for an hour after it ended.
      responses:
        "200":
          description: The upload's state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadStatus" }
        "403": { $ref: "#/components/responses/PrintControlDisabled" }
        "404":
          description: No such upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unknown_upload" }
        "409":
          description: Not the first ElegooSlicer window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "secondary_instance", hint: "close the other ElegooSlicer windows" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Stop sending a print, before the whole file reached the printer
      operationId: cancelUpload
      description: |
        Capability `print_control`. The transfer stops and the print does not start. Once the
        whole file reached the printer it is too late (409 too_late): stop the print with
        POST /printers/{id}/stop. The upload's status becomes `cancelling` at once: if the last
        bytes went out just as the cancel arrived, the printer still starts the print, so
        GET /uploads/{id} keeps watching for a minute and then shows `cancelled` (final) or
        `success`. Until then prepare and print on that printer answer 409 upload_in_progress.
      responses:
        "200":
          description: Cancel requested (also when it already was); `status` is the upload's status now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  status: { type: string, example: cancelling }
        "403": { $ref: "#/components/responses/PrintControlDisabled" }
        "404":
          description: No such upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unknown_upload" }
        "409":
          description: "`too_late` (+ `status`, `hint`): the file was sent, or the upload ended after sending it. `already_ended` (+ `status`, `message`): the transfer failed before the whole file went out; nothing started. Also `secondary_instance`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "too_late", status: "uploading", hint: "the file was sent; stop the print with POST /printers/{id}/stop" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /printers/{id}/pause:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Pause the print in progress
      operationId: pausePrint
      description: |
        Capability `print_control`. Sent straight to the printer, one command at a time per
        printer. Needs a printing printer (ElegooSlicer's cache).
      responses:
        "200": { $ref: "#/components/responses/PrintCommandOk" }
        "400": { $ref: "#/components/responses/PrintCommandBadBody" }
        "403": { $ref: "#/components/responses/PrintControlDisabled" }
        "404": { $ref: "#/components/responses/PrinterNotFound" }
        "409": { $ref: "#/components/responses/PrintCommandRefused" }
        "501": { $ref: "#/components/responses/PrintCommandUnsupported" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/PrinterError" }
        "503": { $ref: "#/components/responses/PrintersUnavailable" }
        "504": { $ref: "#/components/responses/PrintCommandTimeout" }
  /printers/{id}/resume:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Resume a paused print
      operationId: resumePrint
      description: |
        Capability `print_control`. Needs a paused printer (409 not_paused). The Elegoo SDK of
        this build cannot resume a Centauri Carbon 2 over the LAN: 501 resume_unsupported,
        resume on the printer's screen.
      responses:
        "200": { $ref: "#/components/responses/PrintCommandOk" }
        "400": { $ref: "#/components/responses/PrintCommandBadBody" }
        "403": { $ref: "#/components/responses/PrintControlDisabled" }
        "404": { $ref: "#/components/responses/PrinterNotFound" }
        "409": { $ref: "#/components/responses/PrintCommandRefused" }
        "501": { $ref: "#/components/responses/PrintCommandUnsupported" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/PrinterError" }
        "503": { $ref: "#/components/responses/PrintersUnavailable" }
        "504": { $ref: "#/components/responses/PrintCommandTimeout" }
  /printers/{id}/stop:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Stop the print in progress
      operationId: stopPrint
      description: |
        Capability `print_control`. Cannot be undone, so the body must say
        `{"confirm": "stop"}` (else 400 confirm_required). Sent only while the printer is
        printing, pausing or paused, or in a step that starts a print (preheating, homing,
        auto_leveling, self_checking, filament_operating, extruder_operating); else 409
        not_printing (never during a firmware update, a calibration, an error or an unknown
        state).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              additionalProperties: false
              properties:
                confirm: { type: string, enum: [stop] }
      responses:
        "200": { $ref: "#/components/responses/PrintCommandOk" }
        "400": { $ref: "#/components/responses/PrintCommandBadBody" }
        "403": { $ref: "#/components/responses/PrintControlDisabled" }
        "404": { $ref: "#/components/responses/PrinterNotFound" }
        "409": { $ref: "#/components/responses/PrintCommandRefused" }
        "501": { $ref: "#/components/responses/PrintCommandUnsupported" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/PrinterError" }
        "503": { $ref: "#/components/responses/PrintersUnavailable" }
        "504": { $ref: "#/components/responses/PrintCommandTimeout" }
  /filaments:
    get:
      summary: List the filament slots
      operationId: getFilaments
      description: |
        The sidebar's filament list. Slots are 1-based, like the `extruder` setting.
      responses:
        "200":
          description: Filament slots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilamentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
    put:
      summary: Set the number of filament slots
      operationId: setFilamentCount
      description: |
        Adds or removes slots at the end of the list with the sidebar's + and - buttons,
        one at a time, and marks every plate unsliced. Removing a slot that an object,
        part, height range or colour paint prints with is refused (`409 slot_in_use`,
        with `used_by`) unless `force` is true; then the window's delete runs as it is
        (those users move to filament 1, paint in a removed colour is erased, layer tool
        changes to a removed slot are dropped) and per-feature filament settings on a
        removed slot go back to default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: { type: integer, minimum: 1, maximum: 32 }
                force: { type: boolean, default: false }
            example: { count: 4 }
      responses:
        "200":
          description: The slots after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilamentList" }
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            A removed slot is in use, the Filament tab has unsaved edits to a preset only
            a removed slot uses, a G-code file is open, or the print settings disagree
            and the Print tab's check that + and - run would ask a question (`detail`
            has it; fix the settings with PUT /config first).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                in_use:
                  value:
                    error: slot_in_use
                    used_by: [ { object_id: 832, name: "helmet", volume_id: 833, slot: 3, setting: "extruder" } ]
                unsaved: { value: { error: "unsaved_filament_changes" } }
                gcode:   { value: { error: "preview_only" } }
                question: { value: { error: "print_settings_question", detail: "Spiral mode only works when wall loops is 1, ..." } }
        "422":
          description: Count out of range, or the printer preset has one slot per extruder (no + / - buttons).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "bad_count" }
        "500":
          description: |
            The sidebar did not add or remove a slot. Slots already changed by the request
            stay changed (GET /filaments shows where it stopped).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "filament_change_failed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /filaments/{slot}:
    put:
      summary: Set one slot's filament preset and/or colour
      operationId: setFilamentSlot
      description: |
        `preset` goes through the steps of the slot's combo box in the sidebar (a newly
        picked preset brings its default colour unless `color` is given), `color`
        through its colour picker, without their dialogs. The flush volumes are
        recalculated as the "Auto flush after changing..." preference says. A change
        marks every plate unsliced.
      parameters:
        - { name: slot, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preset: { type: string, description: "Filament preset name, compatible with the selected printer." }
                color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
            example: { preset: "Elegoo PETG @ECC2", color: "#1e90ff" }
      responses:
        "200":
          description: The slot after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilamentSlot" }
        "400":
          description: Neither field given, or a malformed body or slot index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "missing_fields" }
        "404":
          description: No such slot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unknown_slot", count: 2 }
        "409":
          description: |
            A G-code file is open, or (single slot) the Filament tab has unsaved edits the
            switch would ask about.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unsaved: { value: { error: "unsaved_filament_changes" } }
                gcode:   { value: { error: "preview_only" } }
        "422":
          description: Unknown or incompatible preset, or a bad colour.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unknown:      { value: { error: "unknown_preset" } }
                incompatible: { value: { error: "incompatible_preset" } }
                color:        { value: { error: "bad_color" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /objects/{id}/split:
    post:
      summary: Split an object into objects, or a part into parts
      operationId: splitObject
      description: |
        Right-click > Split > To objects / To parts, without dialogs. `objects`: one
        object per solid part of a multi-part object, or per shell of a single part;
        `ids` are the new object ids (the original is gone). The window would ask about
        floating pieces; instead `drop_to_bed` (default true) puts every piece on the
        bed, false keeps their heights. `parts`: one part (the only one, or
        `volume_id`) is cut into its shells; `ids` are the object's volume ids
        afterwards. Undoable in the window; the plates holding the result are marked
        unsliced.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, enum: [objects, parts] }
                volume_id: { type: integer, description: "parts: the part to split, when the object has several." }
                drop_to_bed: { type: boolean, default: true, description: "objects: put every piece on the bed." }
            example: { to: objects }
      responses:
        "200":
          description: Split.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids: { type: array, items: { type: integer } }
                  object_id: { type: integer, description: "parts only." }
              example: { ids: [901, 905, 909] }
        "400":
          description: Malformed body or id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown object or volume, or an object without a copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                object: { value: { error: "unknown_object" } }
                volume: { value: { error: "unknown_volume" } }
        "409":
          description: An arrange/orient job is running, an editing tool is open in the 3D view, or the selection failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                job:     { value: { error: "job_running" } }
                gizmo:   { value: { error: "gizmo_editing" } }
                select:  { value: { error: "select_failed" } }
        "422":
          description: A single solid piece (or several parts and no volume_id), or a bad `to`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                single: { value: { error: "not_splittable", detail: "the object is a single solid piece" } }
                to:     { value: { error: "bad_to" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /undo:
    post:
      summary: Undo the last model edit
      operationId: undo
      description: |
        The window's Ctrl+Z on its undo history (object, part, plate and paint edits;
        not presets or settings). `ok` is false when there was nothing to undo. A step
        marks every plate unsliced.
      responses:
        "200":
          description: Done, or nothing to undo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UndoResult" }
        "409":
          description: Slicing, an arrange/orient job, or an editing tool open in the 3D view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                slicing: { value: { error: "slicing" } }
                job:     { value: { error: "job_running" } }
                gizmo:   { value: { error: "gizmo_editing" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /redo:
    post:
      summary: Redo the last undone model edit
      operationId: redo
      description: The window's Ctrl+Y. Same reply and errors as POST /undo.
      responses:
        "200":
          description: Done, or nothing to redo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UndoResult" }
        "409":
          description: Slicing, an arrange/orient job, or an editing tool open in the 3D view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /plates/{index}/layer_changes:
    parameters:
      - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
    get:
      summary: List a plate's layer changes
      operationId: getLayerChanges
      description: |
        The changes the preview's layer slider keeps for the plate (filament changes,
        pauses, custom G-code), sorted by height.
      responses:
        "200":
          description: The plate's layer changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayerChangeList" }
        "404":
          description: No plate with that index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unknown_plate", count: 2 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
    post:
      summary: Add a filament change or a pause at a height
      operationId: addLayerChange
      description: |
        Same data as the preview's layer slider. `z` must be above 0 and below the top
        of the plate's tallest object; a change at the same height (0.001 mm) is
        replaced, unless it is custom G-code. `tool_change` needs `slot`, 2+ filament
        slots, a plate printed with a single filament and no spiral vase.
        `color_change` is refused (ElegooSlicer writes no G-code for it). Marks the
        plate unsliced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [z, type]
              properties:
                z: { type: number, description: "mm" }
                type: { type: string, enum: [tool_change, pause] }
                slot: { type: integer, minimum: 1, description: "tool_change: the filament to change to." }
                message: { type: string, description: "pause: stored with the pause." }
            example: { z: 4.2, type: tool_change, slot: 2 }
      responses:
        "201":
          description: Added; the plate's whole list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayerChangeList" }
        "400":
          description: Malformed body or plate index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No plate with that index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Slicing, or a G-code file is open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                slicing: { value: { error: "slicing" } }
                gcode:   { value: { error: "preview_only" } }
        "422":
          description: Bad height, type or slot (`detail` says why).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                z:    { value: { error: "bad_z", detail: "0 < z < 20.000000 (the plate's tallest object)" } }
                type: { value: { error: "bad_type" } }
                slot: { value: { error: "bad_slot" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
    delete:
      summary: Remove the change at a height
      operationId: deleteLayerChange
      parameters:
        - { name: z, in: query, required: true, schema: { type: number }, description: "mm, matched within 0.001 mm" }
      responses:
        "200":
          description: Removed; the plate's remaining list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayerChangeList" }
        "400":
          description: Missing or malformed z.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "missing_z" }
        "404":
          description: No such plate, or no change at that height.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                plate: { value: { error: "unknown_plate" } }
                z:     { value: { error: "no_change_at_z" } }
        "409":
          description: Slicing, or a G-code file is open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /calibration:
    post:
      summary: Replace the project with a calibration test
      operationId: runCalibration
      description: |
        The window's Calibration menu without its dialogs (capability `calibration`). A
        new project holds the test model; the print, filament and printer settings are
        edited for the test (unsaved). Nothing is sliced. `params` are the dialog's
        fields, all optional with the dialog's defaults (see README.md for each type).
        A project with unsaved changes, or unsaved preset edits, gives
        `409 unsaved_project` unless `discard_project` is true. Allow up to 60 s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [flow_rate, pressure_advance, temperature, retraction, max_volumetric_speed, vfa] }
                params:
                  type: object
                  description: |
                    pressure_advance: method (tower|line|pattern), extruder (dde|bowden), start, end, step,
                    print_numbers (line), accelerations and speeds (pattern; positive whole numbers).
                    flow_rate: test (yolo|yolo_perfectionist|pass1|pass2), pattern (archimedean_chords|monotonic).
                    temperature: start, end (degrees C, multiples of 5, 155..500, start >= end + 5).
                    max_volumetric_speed (mm3/s), vfa (mm/s), retraction (mm): start, end, step.
                discard_project: { type: boolean, default: false, description: "Drop unsaved project changes and preset edits." }
            example: { type: pressure_advance, params: { method: line, end: 0.08 } }
      responses:
        "200":
          description: The test project was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string }
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                  discarded_changes:
                    type: array
                    items: { type: string, enum: [project, print, filament, printer] }
                    description: Present when discard_project dropped something.
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Unsaved work, an arrange/orient job, or a slice is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unsaved: { value: { error: "unsaved_project", project_unsaved: true, presets_unsaved: ["print"] } }
                job:     { value: { error: "job_running" } }
                slicing: { value: { error: "slicing" } }
        "422":
          description: Unknown type, or a parameter the dialog would refuse (`detail` names it).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                type:   { value: { error: "bad_type" } }
                params: { value: { error: "bad_params", detail: "end: must be >= start + step (0.002)" } }
        "500":
          description: The test model did not load.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "calibration_failed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /jobs/status:
    get:
      summary: Whether the arrange/orient job has finished
      operationId: getJobStatus
      description: |
        Poll after POST /arrange or POST /orient until `idle`. `last_error` is the error
        of the last arrange/orient job the API started (the window would have shown it
        in a dialog; it is also shown as a notification), or null.
      responses:
        "200":
          description: The UI job worker's state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  idle: { type: boolean }
                  last_error: { type: string, nullable: true }
              example: { idle: true, last_error: null }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-Api-Token
  responses:
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "unauthorized" }
    UiTimeout:
      description: The GUI thread did not respond within 10s.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "ui_timeout" }
    PrinterNotFound:
      description: No printer has this id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "printer_not_found" }
    PrinterOffline:
      description: ElegooSlicer is not connected to the printer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "printer_offline" }
    UnsupportedOnLan:
      description: The SDK has this data for cloud printers only; nothing was asked.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "unsupported_on_lan" }
    PrinterError:
      description: The printer layer failed; `code` is ElegooSlicer's PrinterNetworkErrorCode.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, enum: [printer_error] }
              code: { type: integer }
          example: { error: "printer_error", code: 8 }
    PrintersUnavailable:
      description: ElegooSlicer is closing or rebuilding its window, or a second window lost its link to the first one. Retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "printers_unavailable" }
    PrinterTimeout:
      description: The printer call did not finish in time (10 s, CANVAS 20 s; all the waits of one request together at most 25 s).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "printer_timeout" }
    PrintControlDisabled:
      description: Print control is off (Preferences > Remote API > Allow sending and controlling prints). Nothing was done.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "print_control_disabled", hint: "Preferences > Remote API > Allow sending and controlling prints" }
    PrintCommandOk:
      description: The printer accepted the command.
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, enum: [true] }
    PrintCommandBadBody:
      description: Bad body. POST /printers/{id}/stop needs {"confirm":"stop"}.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            confirm:       { value: { error: "confirm_required", hint: "send {\"confirm\": \"stop\"}" } }
            invalid_json:  { value: { error: "invalid_json" } }
            unknown_field: { value: { error: "unknown_field", field: "force" } }
    PrintCommandRefused:
      description: "Nothing was sent. `not_printing` / `not_paused` (+ `status`, from ElegooSlicer's cache), `printer_offline`, `printer_busy`, `secondary_instance`, `command_in_progress` (an earlier command for this printer was still running when this one's time ran out)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            not_printing: { value: { error: "not_printing", status: "idle" } }
            not_paused:   { value: { error: "not_paused", status: "printing" } }
            in_progress:  { value: { error: "command_in_progress", hint: "nothing was sent; wait a few seconds, check GET /printers/{id}/status, then retry" } }
            offline:      { value: { error: "printer_offline" } }
            secondary:    { value: { error: "secondary_instance", hint: "close the other ElegooSlicer windows" } }
    PrintCommandUnsupported:
      description: The Elegoo SDK has no such command for this printer, or the printer is a cloud (WAN) printer (the SDK sends these commands over the LAN only; nothing was sent).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            resume:  { value: { error: "resume_unsupported", hint: "resume on the printer's screen" } }
            command: { value: { error: "command_unsupported", command: "pause" } }
            wan:     { value: { error: "unsupported_on_wan", hint: "the Elegoo SDK sends pause, resume and stop over the LAN only: use the printer's screen" } }
    PrintCommandTimeout:
      description: No answer within 20 s. The printer may still carry the command out; check GET /printers/{id}/status.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "printer_timeout", hint: "the printer may still carry out the command: check GET /printers/{id}/status" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        detail: { type: string, description: "Present on 500 responses." }
      required: [error]
    Vec3:
      type: array
      items: { type: number }
      minItems: 3
      maxItems: 3
    Volume:
      type: object
      properties:
        id: { type: integer }
        index: { type: integer, description: "Position in the object's volume list (changes when volumes are added or removed)." }
        name: { type: string }
        type: { type: string, enum: [part, modifier, negative, support_enforcer, support_blocker] }
        extruder: { type: integer, description: "Filament slot, 0 = the object's." }
        size_mm: { $ref: "#/components/schemas/Vec3" }
        position_mm: { $ref: "#/components/schemas/Vec3", description: "World centre of the bounding box, first copy." }
        config: { type: object, additionalProperties: { type: string }, description: "The volume's own overrides." }
    FilamentSlot:
      type: object
      properties:
        slot: { type: integer, description: "1-based." }
        preset: { type: string }
        type: { type: string, example: PLA }
        color: { type: string, example: "#00c1ae" }
        used_on_current_plate: { type: boolean }
    LayerChange:
      type: object
      properties:
        z: { type: number, description: "mm" }
        type: { type: string, enum: [tool_change, pause, custom, color_change] }
        slot: { type: integer, description: "tool_change / color_change: 1-based filament slot." }
        message: { type: string, description: "pause, when one was stored." }
        gcode: { type: string, description: "custom: the G-code (read-only)." }
    LayerChangeList:
      type: object
      properties:
        plate: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/LayerChange" } }
    UndoResult:
      type: object
      properties:
        ok: { type: boolean, description: "False when there was nothing to undo/redo." }
        can_undo: { type: boolean }
        can_redo: { type: boolean }
    FilamentList:
      type: object
      properties:
        count: { type: integer }
        max: { type: integer, example: 32 }
        slots: { type: array, items: { $ref: "#/components/schemas/FilamentSlot" } }
    Status:
      type: object
      properties:
        app: { type: string, example: ElegooSlicer }
        app_version: { type: string, example: "1.5.3.5", description: "ElegooSlicer version this build is based on." }
        orca_compatible_version: { type: string, example: "2.4.2", description: "OrcaSlicer version ElegooSlicer is forked from." }
        mcp_build: { type: integer, example: 1, description: "Release ordinal N of this fork (tags v<app_version>-mcp.N)." }
        api_version: { type: string, example: "1.0" }
        capabilities:
          type: array
          items: { type: string }
          example: [status, config, slice, events, plates, orient_object, view, volumes, project_save, paint]
          description: |
            Feature flags. ElegooSlicer MCP adds `orient_object` (POST /orient with
            object_id), `view` (POST /view and GET /status view), `volumes`
            (/objects/{id}/volumes), `project_save` (POST /project/save) and `paint`
            (POST /objects/{id}/paint).
            Also `filaments` (/filaments), `split` (POST /objects/{id}/split), `undo`
            (POST /undo, /redo), `layer_changes` (/plates/{i}/layer_changes),
            `breakdown_purge` (stats.breakdown.purge of GET /slice/status).
            Also `calibration` (POST /calibration).
        plates:
          type: object
          description: How many plates the project has and which one is current.
          properties:
            count: { type: integer }
            current: { type: integer }
        project: { type: string, description: "Current project filename (may be empty)." }
        objects:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              size_mm: { $ref: "#/components/schemas/Vec3" }
        presets:
          type: object
          properties:
            printer: { type: string }
            print: { type: string }
            filaments: { type: array, items: { type: string } }
        modified:
          type: object
          description: Dirty (unsaved) option keys per preset category.
          properties:
            print: { type: array, items: { type: string } }
            filament: { type: array, items: { type: string } }
            printer: { type: array, items: { type: string } }
        slice_result_valid: { type: boolean }
        view:
          type: string
          enum: [prepare, preview, other]
          description: "Main-window tab on screen (other: home, device and other pages)."
        slicing: { type: boolean, description: "True while a slice is in progress." }
        print_control_enabled: { type: boolean, description: "Preferences > Remote API > Allow sending and controlling prints: the print_control routes answer 403 while false." }
    Plate:
      type: object
      properties:
        index: { type: integer, description: "0-based; shifts down when an earlier plate is deleted." }
        name: { type: string }
        current: { type: boolean, description: "The plate slice/gcode/render act on." }
        locked: { type: boolean }
        empty: { type: boolean }
        slice_result_valid: { type: boolean }
        origin: { $ref: "#/components/schemas/Vec3" }
        bbox_min: { $ref: "#/components/schemas/Vec3" }
        bbox_max: { $ref: "#/components/schemas/Vec3" }
        objects:
          type: array
          description: Instances the plate holds, from the plate's own bookkeeping.
          items:
            type: object
            properties:
              id: { type: integer }
              instance: { type: integer }
              name: { type: string }
    PlateList:
      type: object
      properties:
        plates:
          type: array
          items: { $ref: "#/components/schemas/Plate" }
        count: { type: integer }
        current: { type: integer }
        max: { type: integer, description: "Plate limit of this build." }
        can_add: { type: boolean }
        can_delete: { type: boolean }
    ConfigApplyResult:
      type: object
      properties:
        error: { type: string, enum: [config_rejected], description: "Present on 422 only: a key was refused and nothing was applied." }
        applied: { type: array, items: { type: string } }
        errors:
          type: object
          additionalProperties: { type: string }
          description: "key -> reason (e.g. unknown_key, or a validation message)."
      required: [applied, errors]
    SliceStats:
      type: object
      properties:
        estimated_time: { type: string, example: "27m 23s" }
        estimated_time_seconds: { type: number, example: 1643 }
        filament_used_mm: { type: number, example: 1582 }
        filament_used_g: { type: number, example: 4.72 }
        total_cost: { type: number, example: 0.094 }
        breakdown:
          type: object
          description: |
            Per-feature breakdown (`roles`, ...). With the `breakdown_purge` capability it
            also has `purge`.
          properties:
            purge: { $ref: "#/components/schemas/PurgeStats" }
    PurgeStats:
      type: object
      description: |
        What changing filament costs, as the preview's legend shows it. On the Centauri
        Carbon 2 the start G-code's first filament load (M6211) counts in the time and
        flush too, so a single-filament print reports that load with filament_changes 0.
      properties:
        filament_changes: { type: integer }
        filament_change_time_s: { type: number, description: "Load + unload + tool change time; in the total, in no role." }
        flush_g: { type: number }
        flush_mm: { type: number }
    SliceWarning:
      type: object
      properties:
        level: { type: integer }
        message: { type: string }
        code: { type: string, example: "1000C001" }
    SliceStatus:
      type: object
      properties:
        state: { type: string, enum: [idle, slicing, done, error] }
        percent: { type: integer, description: "-1 when not slicing." }
        message: { type: string }
        stats: { $ref: "#/components/schemas/SliceStats" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/SliceWarning" }
      required: [state, percent, message, warnings]
    Event:
      type: object
      description: |
        A WebSocket message. `event` discriminates the shape.
      properties:
        event:
          type: string
          enum: [slice.started, slice.progress, slice.done, slice.error, slice.cancelled, slice.plate_changed, config.changed, project.opened]
        state: { type: string, description: "slice.* events: idle|slicing|done|error." }
        percent: { type: integer, description: "slice.* events." }
        message: { type: string, description: "slice.* events." }
        stats: { $ref: "#/components/schemas/SliceStats" }
        tabs:
          type: array
          description: "config.changed: which preset categories changed."
          items: { type: string, enum: [print, filament, printer, sla_print, sla_material, other] }
        project: { type: string, description: "project.opened: the opened project filename." }
      required: [event]
    Printer:
      type: object
      description: A printer of the Device tab, written field by field (no secrets).
      properties:
        id: { type: string, example: p3f9c2a71d04e8b65, description: "Opaque, stable across restarts: an HMAC-SHA256 of ElegooSlicer's internal id (which can contain the serial number) with a random per-install key, so the serial number cannot be found from it." }
        name: { type: string }
        model: { type: string, example: Elegoo Centauri Carbon 2 }
        vendor: { type: string, example: Elegoo }
        host: { type: string, description: "A user name/password in a host URL is cut off." }
        port: { type: integer, nullable: true }
        network: { type: string, enum: [lan, wan] }
        firmware: { type: string, nullable: true }
        connected: { type: boolean }
        status:
          type: string
          description: "`offline` when not connected."
          enum: [offline, idle, printing, paused, pausing, canceled, self_checking, auto_leveling, pid_calibrating,
                 resonance_testing, updating, file_copying, file_transferring, homing, preheating, filament_operating,
                 extruder_operating, print_completed, rfid_recognizing, video_composing, emergency_stop,
                 power_loss_recovery, initializing, busy, error, id_not_match, auth_error, unknown]
        status_code: { type: integer, description: "ElegooSlicer PrinterStatus value; -1 when offline." }
        task:
          type: object
          nullable: true
          description: The print in progress; null when idle or offline.
          properties:
            name: { type: string, nullable: true, description: "Always null (not kept for the current print)." }
            file: { type: string, nullable: true }
            progress: { type: integer, description: "0-100" }
            current_s: { type: integer }
            total_s: { type: integer }
            estimated_s: { type: integer }
            begin_ts: { type: integer, nullable: true, description: "Always null (not kept for the current print)." }
        supports:
          type: object
          properties:
            canvas: { type: boolean, description: "Multi-filament (CANVAS) support." }
            timelapse: { type: boolean }
            auto_leveling: { type: boolean }
            bed_switching: { type: boolean }
            auto_refill: { type: boolean }
            filament_mapping: { type: boolean }
    Canvas:
      type: object
      properties:
        connected: { type: boolean, description: "At least one unit is connected." }
        auto_refill: { type: boolean }
        active:
          type: object
          nullable: true
          description: The tray feeding the extruder.
          properties:
            unit: { type: string }
            tray: { type: string, example: A1 }
        units:
          type: array
          items: { $ref: "#/components/schemas/CanvasUnit" }
        external_spool: { type: object, nullable: true, description: "Always null (not provided by the printer layer)." }
        age_s: { type: integer, description: "Seconds since the printer sent this reply (replies are reused for 5 s)." }
    CanvasUnit:
      type: object
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        model: { type: string, nullable: true }
        connected: { type: boolean }
        temperature_c: { type: number, nullable: true, description: "Always null (not provided by the printer layer)." }
        humidity: { type: number, nullable: true, description: "Always null (not provided by the printer layer)." }
        trays:
          type: array
          items: { $ref: "#/components/schemas/CanvasTray" }
    CanvasTray:
      type: object
      description: Filament fields are null for an empty tray.
      properties:
        id: { type: string, example: A1, description: "Name the GUI shows: A1..A4 for the first unit, B1.. for the second." }
        unit: { type: string, description: "The unit's id." }
        index: { type: integer, description: "Position in the unit, from 0." }
        status: { type: string, enum: [empty, preloaded, loaded, unknown_filament, error, unknown] }
        type: { type: string, nullable: true, example: PLA }
        name: { type: string, nullable: true }
        vendor: { type: string, nullable: true }
        color: { type: string, nullable: true, example: "#ffffff" }
        nozzle_temp:
          type: array
          nullable: true
          items: { type: integer }
          minItems: 2
          maxItems: 2
          description: "[min, max] in degrees C."
        bed_temp: { type: array, nullable: true, items: { type: integer }, description: "Always null (not provided by the printer layer)." }
        matched_preset: { type: string, nullable: true, example: "Elegoo PLA @ECC2", description: "System filament preset matched to the loaded tray; the CANVAS sync starts from it." }
        matched_alias: { type: string, nullable: true, example: Elegoo PLA }
    CanvasSyncUnknownTray:
      type: object
      properties:
        tray: { type: string, example: A2 }
        type: { type: string, nullable: true, description: "The tray's filament type; null for an empty tray." }
        reason:
          type: string
          enum: [empty, not_matched, fallback_preset]
          description: |
            `empty` and `not_matched` (no filament preset matches the tray, or it reports an
            unknown filament or an error): left out of the sync. `fallback_preset`: synced with
            a generic, the previous or another preset.
        detail: { type: string, description: "fallback_preset: the line the GUI's warning dialog shows (English)." }
    CanvasSyncResult:
      type: object
      properties:
        synced: { type: integer, description: "Slots that took a tray's filament." }
        slots:
          type: array
          description: Every filament slot of the project after the sync.
          items:
            type: object
            properties:
              slot: { type: integer, description: "1-based." }
              preset: { type: string }
              type: { type: string, nullable: true }
              color: { type: string, nullable: true, example: "#ffffff" }
              tray: { type: string, nullable: true, example: A1, description: "The tray the slot was synced from; null for a color_only slot past the last synced tray." }
        unknown:
          type: array
          items: { $ref: "#/components/schemas/CanvasSyncUnknownTray" }
    CanvasMapping:
      type: object
      properties:
        plate: { type: integer }
        sliced: { type: boolean }
        ok: { type: boolean, description: "No filament has an issue." }
        filaments:
          type: array
          description: The slots the plate prints with (from its slice result when sliced, else from what its objects are set to use).
          items:
            type: object
            properties:
              slot: { type: integer, description: "1-based." }
              preset: { type: string }
              type: { type: string, nullable: true }
              color: { type: string, nullable: true, example: "#ffffff" }
              weight_g: { type: number, nullable: true, description: "The Print dialog's estimate; null until the plate is sliced." }
              tray:
                type: object
                nullable: true
                properties:
                  unit: { type: string }
                  tray: { type: string, example: A1 }
                  type: { type: string }
                  color: { type: string, nullable: true }
              issues:
                type: array
                items: { type: string, enum: [no_tray, type_mismatch, color_mismatch, tray_not_ready] }
    PrintPlan:
      type: object
      properties:
        plan_id: { type: string, description: "For POST /printers/{id}/print; used once." }
        expires_in_s: { type: integer, example: 300 }
        summary: { $ref: "#/components/schemas/PrintSummary" }
    PrintSummary:
      type: object
      description: What the print would do. Show it to the user before starting the print.
      properties:
        printer: { type: string, description: "The printer's name." }
        printer_id: { type: string }
        plate: { type: integer }
        file_name: { type: string, description: "The file's name on the printer, the window's (post-processing scripts may still rename it)." }
        estimated_time_s: { type: integer, nullable: true }
        filament_g: { type: number }
        layers: { type: integer }
        bed_side: { type: string, nullable: true, enum: [A, B], description: "null when the printer has no bed switching." }
        leveling: { type: boolean }
        timelapse: { type: boolean }
        auto_refill: { type: boolean }
        mapping:
          type: array
          description: One item per filament the plate prints with, the items of CanvasMapping.filaments; empty without a connected CANVAS.
          items: { type: object }
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string, enum: [color_mismatch, no_canvas, print_completed, post_processing] }
              slot: { type: integer, description: "color_mismatch: the slot." }
              message: { type: string }
    UploadStatus:
      type: object
      properties:
        status:
          type: string
          enum: [exporting, uploading, cancelling, success, failed, cancelled, unknown]
          description: |
            `exporting`: copying the G-code and running the post-processing scripts.
            `success`: the file was sent and the print started. `cancelling` shows at once after
            DELETE /uploads/{id}: within a minute it becomes `cancelled`, or `success` if the
            file had just been sent. `unknown`: ElegooSlicer closed or rebuilt its window during
            the transfer, so whether the print started is not known: check the printer.
        done: { type: boolean, description: "true once the status will not change any more." }
        progress: { type: integer, minimum: 0, maximum: 100 }
        bytes: { type: array, items: { type: integer }, minItems: 2, maxItems: 2, description: "[sent, total]" }
        message: { type: string, description: "In English; for failed, it says whether the file was sent." }
        code: { type: integer, description: "failed only: ElegooSlicer's PrinterNetworkErrorCode." }
        printer_id: { type: string }
        file_name: { type: string }
    SkippedDialogs:
      type: array
      items: { type: string }
      description: |
        `skipped_dialogs`, added to any JSON reply when the request's GUI work would have
        opened a dialog: an API request never opens one (nobody may be there to close it,
        and it would block the window and every later call). Each entry is the dialog's
        text; a question answered on the API's behalf ends with "(answered No)" or
        "(answered Yes)". The same text is shown as a notification in the window. See
        README.md, "Dialogs".
